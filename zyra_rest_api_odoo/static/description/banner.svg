<svg xmlns="http://www.w3.org/2000/svg" width="1887" height="896" viewBox="0 0 1887 896" role="img" aria-label="Zyra Rest API Manager banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1887" height="896" fill="url(#bg)"/>

  <circle cx="1600" cy="130" r="230" fill="#2dd4bf" fill-opacity="0.13"/>
  <circle cx="1730" cy="780" r="280" fill="#5eead4" fill-opacity="0.10"/>
  <circle cx="1250" cy="750" r="170" fill="#14b8a6" fill-opacity="0.14"/>

  <rect x="84" y="70" width="1700" height="756" rx="32" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.24"/>

  <text x="140" y="190" fill="#99f6e4" font-size="34" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" letter-spacing="3">ODOO MODULE</text>
  <text x="140" y="280" fill="#ffffff" font-size="74" font-family="DejaVu Sans, Arial, sans-serif" font-weight="800">ZYRA REST API MANAGER</text>
  <text x="140" y="340" fill="#d1fae5" font-size="34" font-family="DejaVu Sans, Arial, sans-serif" font-weight="500">Secure, Scalable, Production-Ready API Layer for Odoo</text>

  <rect x="140" y="390" width="280" height="58" rx="14" fill="#14b8a6"/>
  <text x="173" y="428" fill="#ffffff" font-size="28" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">AUTH APIs</text>

  <rect x="438" y="390" width="240" height="58" rx="14" fill="#0891b2"/>
  <text x="470" y="428" fill="#ffffff" font-size="28" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">FULL CRUD</text>

  <rect x="696" y="390" width="312" height="58" rx="14" fill="#0ea5a0"/>
  <text x="729" y="428" fill="#ffffff" font-size="28" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">RATE LIMITING</text>

  <g fill="#e6fffa" font-size="31" font-family="DejaVu Sans, Arial, sans-serif" font-weight="500">
    <text x="146" y="510">• Login, Register, Reset Password, User Details</text>
    <text x="146" y="563">• API Key or Session authentication per endpoint</text>
    <text x="146" y="616">• Model APIs with GET, POST, PUT/PATCH, DELETE</text>
    <text x="146" y="669">• Custom JSON/Text endpoints for integrations</text>
    <text x="146" y="722">• Domain filters, field selection, relations support</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1245" y="210" width="470" height="490" rx="26" fill="#ffffff" fill-opacity="0.93"/>
    <rect x="1278" y="246" width="404" height="58" rx="12" fill="#0f766e"/>
    <text x="1308" y="284" fill="#ffffff" font-size="28" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700">API ROUTE EXAMPLES</text>

    <g fill="#0f172a" font-size="25" font-family="DejaVu Sans Mono, monospace" font-weight="700">
      <text x="1290" y="360">POST  /api/login</text>
      <text x="1290" y="410">POST  /api/register</text>
      <text x="1290" y="460">POST  /api/password/reset</text>
      <text x="1290" y="510">GET   /api/user/details</text>
      <text x="1290" y="560">CRUD  /api/model/&lt;model&gt;</text>
      <text x="1290" y="610">GET   /api/custom/&lt;route&gt;</text>
    </g>
  </g>

  <text x="140" y="802" fill="#99f6e4" font-size="24" font-family="DejaVu Sans, Arial, sans-serif" font-weight="600" letter-spacing="1">Compatible with Enterprise, Odoo.sh, and On-Premise</text>
</svg>
